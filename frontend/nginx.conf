server {
    listen 80;
    absolute_redirect off;          # ngrok (https) orqasida to'g'ri ishlashi uchun
    client_max_body_size 110m;      # hujjatlar backend orqali (100 MB gacha)
    root /usr/share/nginx/html;

    location = / { return 302 /app/; }
    location = /app { return 301 /app/; }

    # React ilovasi: noma'lum yo'llar index.html ga qaytadi
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
    location = /app/index.html {
        add_header Cache-Control "no-cache";
    }
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Fayl ombori (RustFS). Vaqtinchalik havolalar imzosi "rustfs:9000" manzili bilan tuzilgan,
    # shuning uchun Host sarlavhasini aynan shunday uzatamiz.
    location /storage/ {
        proxy_pass http://rustfs:9000/;
        proxy_set_header Host rustfs:9000;
        client_max_body_size 0;            # video bo'laklari
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /test   { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }
}
