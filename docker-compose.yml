name: educonnect

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: educonnect
    volumes:
      - educonnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d educonnect"]
      interval: 5s
      retries: 10

  # Fayl ombori (S3) — RustFS. Boshqaruv paneli: http://localhost:9001
  # (login: EDUCONNECT01 / educonnect-local-secret). MinIO o'z Docker obrazlarini o'chirib yuborgan.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: EDUCONNECT01
      RUSTFS_SECRET_KEY: educonnect-local-secret
    volumes:
      - educonnect_s3:/data
    ports:
      - "9001:9001"
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8001:8000"        # Swagger: http://localhost:8001/docs
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started

  # Videolarni siqadigan fon ishchisi
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      - backend

  frontend:
    build: ./frontend
    ports:
      - "8000:80"          # Telegram (ngrok) shu portga ulanadi
    depends_on:
      - backend
      - rustfs

  bot:
    build: ./bot
    env_file: ./backend/.env   # BOT_TOKEN va WEBAPP_URL shu yerdan olinadi
    restart: unless-stopped

volumes:
  educonnect_pgdata:
  educonnect_s3:
